syntax = "proto3";

package inapi;

option optimize_for = LITE_RUNTIME;
option go_package = "./;inapi";

// Alert is the state record of one built-in alert rule instance, keyed by
// (rule, target) and maintained by the zone leader evaluation loop. A record
// is written on the firing transition (no TTL) and on the resolved
// transition (30-day TTL); steady firing states are refreshed periodically.
message Alert {
  // locating
  string zone = 1;   // zone name
  string rule = 2;   // host_down | disk_full | replica_crashloop
  string target = 3; // host_id for host rules; container name for
                     // replica_crashloop
  string state = 4;  // firing | resolved

  // timeline (unix seconds)
  int64 start_time = 5;  // when the current firing started
  int64 update_time = 6; // last evaluation that changed/refreshed the record
  int32 breach_count = 7; // consecutive evaluations sustaining the condition

  // detail
  string message = 8; // human-readable last event, e.g.
                      // "report age 45s > 30s"
}

message AlertListRequest {
  string state = 3;  // firing | resolved; empty lists all
  string rule = 4;   // exact match; empty lists all

  // standard paging
  int32 page_size = 5;   // default 100, max 1000
  string page_token = 6; // "{rule}/{target}" cursor of the previous page
                         // (exclusive)
}

message AlertListResponse {
  repeated Alert items = 1;
  string next_page_token = 2; // empty when no more items
}
