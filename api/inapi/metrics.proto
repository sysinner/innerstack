syntax = "proto3";

package inapi;

option optimize_for = LITE_RUNTIME;
option go_package = "./;inapi";

// NodeMetrics represents the current status and metrics of a host.
message NodeMetrics {
  // Timestamp fields
  // uptime is the duration in seconds since the host was started.
  int64 uptime = 5;
  // updated is the Unix timestamp of the last status update.
  int64 updated = 6;

  // cpu_cores is the number of CPU cores.
  int64 cpu_cores = 11;
  // cpu_sys is the CPU time spent in system mode (in jiffies or
  // milliseconds).
  int64 cpu_sys = 12;
  // cpu_user is the CPU time spent in user mode (in jiffies or milliseconds).
  int64 cpu_user = 13;

  // Memory Info
  // mem_total is the total memory in bytes.
  int64 mem_total = 20;
  // mem_used is the used memory in bytes.
  int64 mem_used = 21;
  // mem_available is the available memory in bytes.
  int64 mem_available = 22;

  // Network IO
  // net_recv_bytes is the total bytes received over the network.
  int64 net_recv_bytes = 40;
  // net_recv_count is the total number of packets received.
  int64 net_recv_count = 41;
  // net_sent_bytes is the total bytes sent over the network.
  int64 net_sent_bytes = 42;
  // net_sent_count is the total number of packets sent.
  int64 net_sent_count = 43;

  // Storage IO
  // disk_read_bytes is the total bytes read from disk.
  int64 disk_read_bytes = 50;
  // disk_read_count is the total number of disk read operations.
  int64 disk_read_count = 51;
  // disk_write_bytes is the total bytes written to disk.
  int64 disk_write_bytes = 52;
  // disk_write_count is the total number of disk write operations.
  int64 disk_write_count = 53;

  // Storage Usage
  // disk_total_bytes is the total disk capacity in bytes.
  int64 disk_total_bytes = 54;
  // disk_free_bytes is the free disk space in bytes.
  int64 disk_free_bytes = 55;

  // restart_count is the container driver's cumulative restart counter
  // (docker RestartCount), carried on the regular replica metrics report.
  // The zone leader derives replica_crashloop alert events from its
  // deltas; a decrease means the container was recreated and the event
  // window restarts from zero.
  int32 restart_count = 60;
}

// HostMetricsRequest queries the built-in host metrics history (monstore).
message HostMetricsRequest {
  // host_id is the host to query; required, exact match.
  string host_id = 1;

  // field filters to one monstore field (cpu_millicores, mem_used, ...);
  // empty returns all fields.
  string field = 2;

  // window bounds in unix seconds; 0 means unbounded.
  int64 start_time = 3;
  int64 end_time = 4;

  // step_seconds downsamples the series by taking the last raw sample of
  // each step bucket; 0 returns the raw samples.
  int64 step_seconds = 5;

  // max_points caps the returned points per series (default 1000,
  // max 10000).
  int32 max_points = 6;
}

// HostMetricsPoint is one sample of a host metrics series.
message HostMetricsPoint {
  int64 time = 1;  // unix seconds
  int64 value = 2; // field-dependent unit (millicores, bytes, bytes/s)
}

// HostMetricsSeries is the point list of one field.
message HostMetricsSeries {
  string field = 1;
  repeated HostMetricsPoint points = 2;
}

message HostMetricsResponse {
  repeated HostMetricsSeries series = 1;
}
